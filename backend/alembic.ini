[alembic]
# path to migration scripts
script_location = alembic

# database url
sqlalchemy.url = sqlite:///./roomfund.db

# version location
version_locations = %(here)s/alembic/versions

# max length of characters to apply to the
# "version code" column
max_varchar_length = 1024

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated migration scripts.
# See https://alembic.sqlalchemy.org/en/latest/api/hooks.html
# for more details and examples.

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname = root

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
handlers = console

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S